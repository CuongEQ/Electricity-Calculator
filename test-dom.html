<!DOCTYPE html>
<html>
<head>
  <script type="module">
    await new Promise(r => setTimeout(r, 1000));
    console.log("Module eval");
    document.addEventListener("DOMContentLoaded", () => {
      console.log("DOMContentLoaded inside module");
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      console.log("DOMContentLoaded normal");
    });
  </script>
</head>
<body>
  <h1>Test</h1>
</body>
</html>
